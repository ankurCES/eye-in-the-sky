  <title>God's Eye View</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Intelligence console (src/console). Its tokens and every rule are scoped
       under .ic-root; console.css @imports the orb, chat and panel partials.
       Linked here, never imported from JS (node:test cannot import CSS). -->
  <link rel="stylesheet" href="/src/console/console.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- The console's faces: Atkinson Hyperlegible keeps 0/O, 1/l/I and 5/S apart
       in track ids. Offline, console.css falls back to "IC Sans Fallback". -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_back,arrow_drop_down,arrow_forward,arrow_left,arrow_right,block,bolt,bubble_chart,center_focus_weak,check,chevron_left,chevron_right,close,close_fullscreen,cloud_off,content_copy,dark_mode,draw,east,error,expand_more,fit_screen,flare,flight,flight_takeoff,forum,gpp_maybe,info,keyboard,layers_clear,light_mode,link_off,local_fire_department,login,manage_search,more_horiz,my_location,navigation,normal,on,open_in_full,pan_tool,pause,play_arrow,public,radar,radio,refresh,right_panel_close,right_panel_open,rocket_launch,route,schedule,search,send,sensors,skip_next,skip_previous,stop,tune,view_in_ar,view_list,warning,zoom_in,zoom_out" rel="stylesheet" />
</head>
